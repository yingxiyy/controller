mongodb.enable=true
# enable auto restore data from mongodb
mongodb.restore.auto.enable=true
#mongodb.ip=10.242.111.24
mongodb.servers=116.128.200.229:37011
#mongodb.servers=10.242.111.29:27017,10.242.111.29:27018,10.242.111.29:27019,10.242.111.29:27020
#mongodb.port=27017
# database name
mongodb.database=sotn
# snapshot frequency, default is 100. 100 stands for 100 changes happened in config-tree mongodb save once
mongodb.snapshot.freq=100
#mongodb.user=
mongodb.user=dci
mongodb.pwd=dciworld@iivi
#defalut is null(supported sha1,sha256,mongd-cr), other mechanism supported SHA-1,SHA-256,MONGODB-CR,X-509,PLAIN,GSSAPI
#mongodb.mechanism = sha-1
#connection timeout, milliseconds.default is 120000
mongodb.client.option.connectTimeout=120000
# maximum life time for a pooled connection,milliseconds,default is 300000
mongodb.client.option.maxConnectionLifeTime=300000
# maximum idle life time for a pooled connection,milliseconds,default is 10000
mongodb.client.option.maxConnectionIdleTime=10000
# maximum number of connections per host,default is 10
mongodb.client.option.connectionsPerHost=10
