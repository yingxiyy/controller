ZOOKEEPER_SERVERS=127.0.0.1:2181
# controller/adapter/collector/parser/monitor/maintenanceTool
MODULE=implementor
NAMESPACE=zxy
# when this module is running on VM or physical machine, myIP=hostIp
# but when it's running on docker/k8s, 
# myIp is k8s's pod Ip, hostIp is nodeIp
# thus myIp and hostIp is filled by application.
myIp=127.0.0.1
hostIp=127.0.0.1
port=@port.impl-app@

# support remove 3rd leg and bone2.0
sw_version=v1.2.3.0
# a list of south side api (yang) version
sbi_version=@yangVersion@
ZOOKEEPER_AUTH_SCHEME=
ZOOKEEPER_USERNAME=
ZOOKEEPER_PASSWORD=
base_version=v1
release_count=0
last_commit_time=20260428
