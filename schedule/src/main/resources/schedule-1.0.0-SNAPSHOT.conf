# Boot's executable launcher loads the conf matching the jar basename.
# Budget RSS, including metaspace, code cache and native allocations, not just heap.
export MALLOC_ARENA_MAX=2
export JAVA_OPTS="-server -Xms32m -Xmx96m -Xss256k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=2 -XX:ReservedCodeCacheSize=32m"
