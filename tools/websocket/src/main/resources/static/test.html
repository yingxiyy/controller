<page language="java" contentType="text/html; charset=utf-8" pageEncoding="utf-8">
<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Insert title here</title>
</head>
<body>
<script type="text/javascript" src="http://cdn.bootcss.com/jquery/3.1.0/jquery.min.js"></script>
<script type="text/javascript" src="http://cdn.bootcss.com/sockjs-client/1.1.1/sockjs.js"></script>
<script type="text/javascript">
  var output;
  var websocket;

  function formatDate(now)   {
    var   year=now.getFullYear();
    var   month=now.getMonth()+1;
    var   date=now.getDate();
    var   hour=now.getHours();
    var   minute=now.getMinutes();
    var   second=now.getSeconds();
    return   year+"-"+(month=month<10?("0"+month):month)+"-"+(date=date<10?("0"+date):date)+" "+(hour=hour<10?("0"+hour):hour)+":"+(minute=minute<10?("0"+minute):minute)+":"+(second=second<10?("0"+second):second) + "&nbsp;&nbsp;";
  }

  function init() {
      output = document.getElementById("output");
  }
  function connect() {
    var wsaddr = $("#wsaddr").val();
    if (wsaddr=='') {
      alert("请填写websocket的地址");
      return false;
    }
    StartWebSocket(wsaddr);
  }
  function StartWebSocket(wsUri) {
    websocket = new WebSocket(wsUri);
    websocket.onopen = function(evt) { onOpen(evt) };
    websocket.onclose = function(evt) { onClose(evt) };
    websocket.onmessage = function(evt) { onMessage(evt) };
    websocket.onerror = function(evt) { onError(evt) };
  }
  function onOpen(result) {
    writeToScreen("<span style='color:red'>websocket连接成功!!!</span>");
  }
  function onClose(evt) {
    writeToScreen("<span style='color:red'>websocket连接已断开!!!</span>");
		websocket.close();
	}
	function onMessage(evt) {
	  writeToScreen('<span style="color:blue">&gt;&gt;&gt;' + formatDate(new Date()) + evt.data + '</span>');
	}
  function onError(evt) {
    writeToScreen('<span style="color: red;">发生错误:</span> '+ evt.data);
	}
    //使用连接发送数据
  function doSend() {
    if (websocket.readyState == websocket.OPEN) {
      var msg = document.getElementById("inputMsg").value;
      websocket.send(msg);//调用后台handleTextMessage方法
      writeToScreen('<span style="color:blue">&lt;&lt;&lt;' + formatDate(new Date()) + msg + '</span>');
    } else {
      writeToScreen('<span style="color: red;">连接失败。</span> ');
    }
  }
  function disconnect() {
    if (websocket.readyState == websocket.OPEN) {
      websocket.close();
      writeToScreen('<span style="color: red;">webSocket 关闭成功</span> ');
    } else {
      writeToScreen('<span style="color: red;">webSocket 已经关闭</span> ');
    }
  }

  function writeToScreen(message) {
    var div = "<div class='newmessage'>"+message+"</div>";
    var d = $("#output");
    var d=d[0];
        var doScroll = d.scrollTop == d.scrollHeight - d.clientHeight;
    $("#output").append(div);
        if (doScroll) {
            d.scrollTop = d.scrollHeight - d.clientHeight;
        }
  }

  //窗口关闭时,将websocket连接关闭
  window.close=function() {
    websocket.close();
  }
</script>
<div>
  <input type='text' value='ws://localhost:8080/websocket/notification:object-notification'
         class="form-control" style='width:390px;display:inline' id='wsaddr'/>
  <div class="btn-group" role="group" aria-label="...">
    <button type="button" class="btn btn-default" onclick='connect();'>Connection</button>
    <button type="button" class="btn btn-default" onclick='disconnect();'>Disconnect</button>
    <button type="button" class="btn btn-default" onclick='$("#wsaddr").val("ws://localhost:8080/websocket/notification:object-notification")'>Example</button>
    <button type="button" class="btn btn-default" onclick='$("#wsaddr").val("")'>Clear</button>
  </div>
</div>
<div class="row" >
  <div id="output" style="border:1px solid #ccc;height:365px;overflow: auto;margin-left:15px"></div>
  <div class="col-lg-6">

    <div class="input-group" style=''>
      <input type="text" id='inputMsg'  class="form-control" style='width:810px' placeholder='Pending message'>
      <span class="input-group-btn">
        <button class="btn btn-default" type="button" onclick="doSend();">Send</button>
      </span>
    </div>
  </div>
</div>

</body>
</html>
