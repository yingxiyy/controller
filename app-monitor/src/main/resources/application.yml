server:
  port: @port.app-monitor@
author:
  account: admin
  password: admin
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false
---
spring:
  config:
    activate:
      on-profile: default
kafka:
  bootstrap-servers: 10.242.111.39:9092
  replication-factor: 1
  consumer-group: app-monitor-test

#logging.level.org.springframework.web: DEBUG
logging.level.org.springframework.boot: DEBUG
#logging.level.org.springframework.cloud.stream: DEBUG
logging.level.org.apache.kafka.clients: OFF
#logging.level.root: DEBUG
---
spring:
  config:
    activate:
      on-profile: production
kafka:
  bootstrap-servers: ${KAFKA_BROKER}
  replication-factor: 1
  consumer-group: status-monitor
logging.level.net.flex.dci.otn.controller.app.monitor: INFO