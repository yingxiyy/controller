server:
  port: @port.otdr-manager@
spring.http.multipart.max-file-size: 50Mb
spring.http.multipart.max-request-size: 50Mb
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false
---
spring:
  config:
    activate:
      on-profile: default
kafka:
  bootstrap-servers: 10.242.111.39:9092
  replication-factor: 1
  consumer-group: otdr-monitor

logging:
  config: classpath:logback-spring.xml
  level:
    org.springframework.web: DEBUG
    org.apache.kafka.clients: OFF

#logging.level.org.springframework.web: DEBUG
logging.level.org.springframework.boot: DEBUG
#logging.level.org.springframework.cloud.stream: DEBUG
logging.level.org.apache.kafka.clients: OFF
#logging.level.root: DEBUG
---
spring:
  config:
    activate:
      on-profile: production

logging.level.net.flex.dci.otn.controller.db.monitor: INFO
kafka:
  bootstrap-servers: ${KAFKA_BROKER}
  replication-factor: 1
  consumer-group: otdr-monitor
