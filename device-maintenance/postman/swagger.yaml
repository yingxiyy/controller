  /device-maintenance:batch-backup-devices:
    post:
      summary: 批量设备备份（支持单设备和多设备）
      description: |
        执行设备数据备份操作，支持两种模式：
        
        **批量模式** (batchName提供):
        - 创建Batch对象
        - 发送TaskInfo通知
        
        **单设备模式** (batchName=null):
        - 不创建Batch对象
        - 不发送TaskInfo通知
        
        **备份文件路径规则**:
        路径自动生成为: `basePath/[设备名]/[日期]/[时间戳].db`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceIds
                - basePath
                - sftpServerName
              properties:
                batchName:
                  type: string
                  nullable: true
                  description: 批次名称（null=单设备模式）
                deviceIds:
                  type: array
                  items:
                    type: string
                  description: 设备ID数组
                basePath:
                  type: string
                  description: 备份基础路径（不是完整文件路径）
                  example: "/dbbackup"
                sftpServerName:
                  type: string
                  description: SFTP服务器名称
                scheduledTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: 定时执行时间（null=立即执行）
                remark:
                  type: string
                  description: 备注信息
                debug:
                  type: boolean
                  default: false
                  description: Debug模式
      responses:
        "200":
          description: 备份任务启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /device-maintenance:restore-device-data:
    post:
      summary: 设备数据恢复（已废弃）
      deprecated: true
      description: |
        **已废弃** - 请使用 `/device-maintenance:batch-restore-devices` 接口

        从SFTP下载备份文件并执行设备数据恢复操作（单设备）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceId
                - filePath
              properties:
                deviceId:
                  type: string
                  description: 设备ID
                filePath:
                  type: string
                  description: 备份文件完整路径（从SFTP根目录的相对路径，如 /dbbackup/backup_20250101.db）
                sftpServerName:
                  type: string
                  description: SFTP服务器名称（可选，未指定时使用默认配置）
                scheduledTime:
                  type: string
                  format: date-time
                  description: 计划执行时间（可选，为空则立即执行）
      responses:
        "200":
          description: 恢复任务启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /device-maintenance:batch-restore-devices:
    post:
      summary: 批量设备数据恢复
      description: |
        批量恢复设备数据，支持：
        - 单设备或多设备批量恢复
        - 自动查找最新备份（dateDir为null时）
        - 指定日期目录恢复（dateDir指定具体日期）
        - 立即执行或定时执行
        - Debug模式（记录RPC请求/响应详情）

        **自动查找备份规则：**
        1. 路径结构：`rootPath/[设备名]/[日期目录]/[备份文件].db`
        2. dateDir为null时，自动查找最新日期目录
        3. 在指定/最新日期目录下，自动选择最新时间戳的备份文件
      tags:
        - Batch Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceIds
                - rootPath
                - sftpServerName
              properties:
                batchName:
                  type: string
                  description: 批次名称（可选，未指定时自动生成）
                  example: "批量恢复-20251027"
                deviceIds:
                  type: array
                  items:
                    type: string
                  description: 设备ID数组（支持单设备或多设备）
                  example: ["Site-xxx#Ne-yyy"]
                basePath:
                  type: string
                  description: 备份根路径
                  example: "/dbbackup"
                dateDir:
                  type: string
                  nullable: true
                  description: |
                    日期目录（yyyyMMdd格式，可选）：
                    - null或未提供：自动查找最新日期目录
                    - 指定日期：在该日期目录下查找最新备份
                  example: "20251027"
                sftpServerName:
                  type: string
                  description: SFTP服务器ID
                  example: "test-sftp-user1"
                scheduledTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: 定时执行时间（可选，null=立即执行）
                  example: "2025-10-30T10:30:00"
                remark:
                  type: string
                  description: 备注信息
                  example: "测试批量恢复"
                debug:
                  type: boolean
                  description: Debug模式（启用后会记录RPC请求/响应详情）
                  default: false
      responses:
        "200":
          description: 批量恢复任务启动成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/BatchRestoreSummary"
                  timestamp:
                    type: integer
                    format: int64

  /device-maintenance:commit-upgrade:
    post:
      summary: 升级确认
