        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceId
              properties:
                deviceId:
                  type: string
                  description: 设备ID
                sftpServerName:
                  type: string
                  description: SFTP服务器名称（可选，未指定时使用默认配置）
      responses:
        "200":
          description: 确认操作启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /device-maintenance:get-device-tasks:
    post:
      summary: 查询设备任务列表
      description: 获取设备任务列表，支持类型和状态过滤
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taskType:
                  type: string
                  enum: [DOWNLOAD, BACKUP, RESTORE, UPGRADE, ROLLBACK, COMMIT]
                  description: 任务类型过滤条件
                status:
                  type: string
                  enum:
                    [
                      SCHEDULED,
                      PENDING,
                      RUNNING,
                      COMPLETED,
                      FAILED,
                      CANCELLED,
                      EXPIRED,
                    ]
                  description: 状态过滤条件
                deviceId:
                  type: string
                  description: 设备ID过滤条件
                page:
                  type: integer
                  minimum: 0
                  description: 页码（从0开始，默认0）
                  default: 0
                size:
                  type: integer
                  minimum: 1
                  description: 每页数量（默认20）
                  default: 20
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceTask"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: 服务内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /device-maintenance:get-device-task-detail:
    post:
      summary: 查询设备任务详情
      description: 根据任务ID获取设备任务详情
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
              properties:
                taskId:
                  type: string
                  description: 任务ID
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/DeviceTask"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: 服务内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /device-maintenance:cancel-device-task:
    post:
      summary: 取消设备任务
      description: |
        取消指定的设备任务。

        **取消规则**：
        - 只能取消处于 SCHEDULED（计划中）、PENDING（待执行）或 RUNNING（执行中）状态的任务
        - 取消后任务状态变为 CANCELLED（已取消）
        - 已完成、已失败或已取消的任务不能再次取消
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
              properties:
                taskId:
                  type: string
                  description: 任务ID
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: string
                    description: 被取消的任务ID
        "400":
          description: 任务状态不允许取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: 服务内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /device-maintenance:delete-device-task:
    post:
      summary: 删除设备任务
      description: |
        删除指定的设备任务。

        **删除规则**：
        - 只能删除处于 COMPLETED（已完成）、FAILED（失败）、CANCELLED（已取消）或 EXPIRED（已过期）状态的任务
        - 正在执行、待执行或计划中的任务不能直接删除，需要先取消
        - 删除操作会从数据库中永久移除任务记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
              properties:
                taskId:
                  type: string
                  description: 任务ID
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: string
                    description: 被删除的任务ID
        "400":
          description: 任务状态不允许删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: 服务内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

