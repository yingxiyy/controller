        "200":
          description: 回滚任务启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"


  /device-maintenance:batch-download-software:
    post:
      summary: 批量软件下载（支持单设备和多设备）
      description: |
        通过指定SFTP配置让设备下载软件，支持两种模式：
        
        **批量模式** (batchName提供):
        - 创建Batch对象
        - 发送TaskInfo通知
        - DeviceTask.batchId有值
        
        **单设备模式** (batchName=null):
        - 不创建Batch对象
        - 不发送TaskInfo通知
        - DeviceTask.batchId=null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceIds
                - softwarePackage
                - sftpServerId
              properties:
                batchName:
                  type: string
                  nullable: true
                  description: 批次名称（null=单设备模式，不创建Batch；提供值=批量模式，创建Batch）
                deviceIds:
                  type: array
                  items:
                    type: string
                  description: 设备ID数组（单设备模式只需传入一个ID）
                softwarePackage:
                  type: string
                  description: 软件包文件名
                sftpServerName:
                  type: string
                  description: SFTP服务器名称
                scheduledTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: 定时执行时间（null=立即执行）
                remark:
                  type: string
                  description: 备注信息
                debug:
                  type: boolean
                  default: false
                  description: Debug模式（保存RPC payload到DeviceTask）
      responses:
        "200":
          description: 下载任务启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"


  /device-maintenance:batch-upgrade-software:
    post:
      summary: 批量设备升级（仅批量模式,batchName必填）
      description: |
        创建设备升级批次任务，支持下载-备份-升级工作流。
        
        **注意**: 升级操作需要工作流管理，batchName必填，不支持单设备模式。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceIds
                - filePath
                - targetVersion
                - sftpServerName
              properties:
                deviceIds:
                  type: array
                  items:
                    type: string
                  description: 设备ID数组
                filePath:
                  type: string
                  description: 升级包文件路径
                targetVersion:
                  type: string
                  description: 目标版本号
                sftpServerName:
                  type: string
                  description: SFTP服务器名称
                autoBackup:
                  type: boolean
                  default: true
                  description: 是否自动备份
                forceUpgrade:
                  type: boolean
                  default: false
                  description: 是否强制升级
                autoRestart:
                  type: boolean
                  default: true
                  description: 是否自动重启
                timeoutMinutes:
                  type: integer
                  default: 30
                  description: 超时时间（分钟）
                scheduledTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: 定时执行时间
                debug:
                  type: boolean
                  default: false
                  description: Debug模式
      responses:
        "200":
          description: 升级任务启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"


  /device-maintenance:get-batch-detail:
