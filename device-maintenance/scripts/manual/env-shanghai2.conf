# ============================================================================
# Device Maintenance - 上海2环境配置文件
# ============================================================================
# 本配置文件用于手动部署脚本
# 修改此文件可以适配不同的环境
# ============================================================================

# ============================================================================
# 服务器连接配置
# ============================================================================
SERVER_HOST="116.128.204.12"
SERVER_USER="actsvt112"
SERVER_PASSWORD="pureg123!@#"
SSH_PORT="13112"

# ============================================================================
# 部署配置
# ============================================================================
DEPLOY_BASE="/home/dci/deploy"  # 修改为标准路径（与其他微服务一致）
APP_NAME="device-maintenance"
VERSION="1.0.0-SNAPSHOT"
PACKAGE_NAME="device-maintenance"
SERVICE_NAME="device-maintenance"

# ============================================================================
# 应用运行时环境变量（传递给 install.sh）
# ============================================================================

# 应用端口
SERVER_PORT="18008"

# 本机IP（服务注册到ZK时使用）
# 设置为 0.0.0.0 让程序自动检测（与其他微服务一致）
myIp="0.0.0.0"

# MySQL数据库配置
MYSQL_IP="127.0.0.1"
MYSQL_PORT="3309"
MYSQL_USER="root"
MYSQL_PASSWORD="dciworld@iivi"

# MongoDB配置
MONGO_SERVERS="127.0.0.1:27010,127.0.0.1:27011,127.0.0.1:27012"
MONGO_DATABASE="sotn"
MONGO_USER="dci"
MONGO_PWD="dciworld@iivi"

# Kafka配置
KAFKA_BROKER="127.0.0.1:9092,127.0.0.1:9093,127.0.0.1:9094"

# ZooKeeper配置
pmcZooKeepers="127.0.0.1:2190,127.0.0.1:2191,127.0.0.1:2192"

# ZooKeeper命名空间（⭐ 上海2环境专用：clband，不带dciworld/前缀）
# 注意：配置文件中写 "clband"，zkclient4boot会自动加上 /dciworld/ 前缀
NAMESPACE="clband"

# 软件版本
swVersion="1.0.0-SNAPSHOT"

# ============================================================================
# 说明
# ============================================================================
# - myIp: 服务注册到ZooKeeper时使用的IP地址
#   - 设置为 0.0.0.0 时，ConfLoader 会自动检测本机IP
#   - 这样更灵活，无需为每台机器单独配置
# - NAMESPACE: ZooKeeper命名空间（不带 /dciworld/ 前缀）
#   - 上海环境: default
#   - 上海2环境: clband ⭐
#   - zkclient4boot会自动将其包装为 /dciworld/{NAMESPACE}/STATE/...
# - DEPLOY_BASE: 部署根目录
#   - 标准路径: /home/dci/deploy （与其他微服务一致）
# - 所有这些变量将被传递给 install.sh 脚本
# - install.sh 会使用 sed 将这些值替换到配置文件中

