# ============================================================================
# MongoDB Configuration - Device Maintenance Service
# ============================================================================
#
# 配置说明：
#   - 生产环境：由 install.sh 脚本自动替换以下占位符
#   - 本地开发：使用默认值（或手动修改为本地环境）
# ============================================================================

# MongoDB 基本配置
mongodb.enable=true
mongodb.restore.auto.enable=true

# MongoDB 连接信息（生产环境由 install.sh 自动替换）
mongodb.servers=127.0.0.1:27010,127.0.0.1:27011,127.0.0.1:27012
mongodb.database=sotn
mongodb.user=dci
mongodb.pwd=dciworld@iivi

# MongoDB 认证机制（可选）
# 支持: SHA-1, SHA-256, MONGODB-CR, X-509, PLAIN, GSSAPI
#mongodb.mechanism=sha-1

# MongoDB 连接池配置
# 连接超时时间（毫秒，默认: 120000）
mongodb.client.option.connectTimeout=120000
# 连接最大生命周期（毫秒，默认: 300000）
mongodb.client.option.maxConnectionLifeTime=300000
# 连接最大空闲时间（毫秒，默认: 10000）
mongodb.client.option.maxConnectionIdleTime=10000
# 每个主机的最大连接数（默认: 10）
